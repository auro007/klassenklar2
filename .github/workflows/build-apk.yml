name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Release File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Klassenklar-v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klassenklar-v2-APK
          path: Klassenklar-v2.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Klassenklar Version 2.0 (Android APK)
          body: |
            ### 📱 Klassenklar Version 2.0 - Android APK

            Hier kannst du die fertige APK-Datei direkt herunterladen:
            - **Klassenklar-v2.apk** (siehe Assets unten)

            Einfach auf dem Android-Smartphone herunterladen, antippen und installieren.
          files: Klassenklar-v2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
