<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="auto">
  <title>AutoFOM III Systemaufbau und Ultraschallmessung</title>
  <desc>Schematische Darstellung des AutoFOM III Ultraschall-Arrays mit 16 Schallköpfen am Schlachtband, Datenverarbeitung und Teilstückanalyse.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F8FA"/>
      <stop offset="100%" stop-color="#E5EFF2"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="pigGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2C1B6"/>
      <stop offset="100%" stop-color="#E5A89C"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="380" rx="12" fill="url(#bgGrad)"/>

  <!-- Conveyor Track (Schlachtband) -->
  <line x1="40" y1="45" x2="720" y2="45" stroke="#78909C" stroke-width="6" stroke-dasharray="16,8"/>
  <rect x="250" y="38" width="260" height="14" rx="4" fill="#455A64"/>
  <text x="380" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#37474F" text-anchor="middle">Schlachtband (Förderkette · ungeöffneter Schlachtkörper)</text>

  <!-- Hook & Carcass Suspension -->
  <line x1="380" y1="52" x2="380" y2="90" stroke="#37474F" stroke-width="4"/>
  <circle cx="380" cy="56" r="5" fill="#CFD8DC" stroke="#37474F" stroke-width="2"/>
  <path d="M 370 90 Q 380 100 390 90" fill="none" stroke="#37474F" stroke-width="4"/>

  <!-- Pig Carcass Profile (ungeöffnet, gleitet mit dem Rücken über das Array) -->
  <path d="M 380 95 C 440 120 450 190 410 220 C 370 235 320 220 310 180 C 300 130 340 105 380 95 Z" fill="url(#pigGrad)" stroke="#C47D70" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 360 115 Q 385 145 375 195" fill="none" stroke="#D32F2F" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="420" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8D4336">Schlachtkörper (Rücken)</text>

  <!-- Ultrasound Beams -->
  <path d="M 270 248 L 340 205 M 300 252 L 355 210 M 340 255 L 375 212 M 380 255 L 385 215 M 420 255 L 395 212 M 460 252 L 405 210 M 490 248 L 420 205" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- U-shaped Array Holder (Bügel mit 16 Köpfen) -->
  <path d="M 230 225 Q 380 280 530 225" fill="none" stroke="#37474F" stroke-width="16" stroke-linecap="round"/>
  <path d="M 230 225 Q 380 280 530 225" fill="none" stroke="#90A4AE" stroke-width="10" stroke-linecap="round"/>

  <!-- 16 Transducer Heads (Schallköpfe) -->
  <g fill="url(#sensorGrad)" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="260" cy="242" r="6"/><circle cx="276" cy="247" r="6"/>
    <circle cx="292" cy="251" r="6"/><circle cx="308" cy="254" r="6"/>
    <circle cx="324" cy="257" r="6"/><circle cx="340" cy="259" r="6"/>
    <circle cx="356" cy="260" r="6"/><circle cx="372" cy="261" r="6"/>
    <circle cx="388" cy="261" r="6"/><circle cx="404" cy="260" r="6"/>
    <circle cx="420" cy="259" r="6"/><circle cx="436" cy="257" r="6"/>
    <circle cx="452" cy="254" r="6"/><circle cx="468" cy="251" r="6"/>
    <circle cx="484" cy="247" r="6"/><circle cx="500" cy="242" r="6"/>
  </g>
  <rect x="290" y="275" width="180" height="20" rx="4" fill="#006064"/>
  <text x="380" y="289" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#E0F7FA" text-anchor="middle">16 Ultraschallköpfe (Abstand 25 mm)</text>

  <!-- Water Coupling (Ankopplung) -->
  <path d="M 235 205 Q 245 220 255 235 M 525 205 Q 515 220 505 235" stroke="#29B6F6" stroke-width="3" stroke-linecap="round"/>
  <text x="215" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0288D1" text-anchor="end">Wasserzufuhr</text>
  <text x="215" y="207" font-family="system-ui, sans-serif" font-size="9" fill="#546E7A" text-anchor="end">(Akustische Ankopplung)</text>

  <!-- Cable to Splitbox (10 rein, 1 raus) -->
  <path d="M 505 255 Q 560 280 600 280" fill="none" stroke="#263238" stroke-width="4"/>
  <text x="560" y="272" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#37474F">Array-Kabel</text>

  <!-- Splitbox -->
  <rect x="600" y="250" width="125" height="60" rx="6" fill="#FFFFFF" stroke="#00838F" stroke-width="2" filter="url(#shadow)"/>
  <text x="662" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#006064" text-anchor="middle">Splitbox 2×</text>
  <text x="662" y="286" font-family="system-ui, sans-serif" font-size="9" fill="#455A64" text-anchor="middle">Kabel: 10× rein, 1× raus</text>
  <text x="662" y="300" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#00838F" text-anchor="middle">Haupttypenschild</text>

  <!-- Control Unit & CaroSecure (Left) -->
  <rect x="35" y="110" width="150" height="95" rx="6" fill="#FFFFFF" stroke="#37474F" stroke-width="2" filter="url(#shadow)"/>
  <rect x="45" y="118" width="130" height="20" rx="3" fill="#37474F"/>
  <text x="110" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Auto-FOM III Steuerstand</text>
  <text x="45" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#263238">• Analysetest: <b>4 Testschweine</b></text>
  <text x="45" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#263238">• Schallkopftest: <b>50 ± 1 mm</b></text>
  <text x="45" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#263238">• Frontendboard: <b>3 Jahre</b></text>
  <text x="45" y="191" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#00838F">• Gesichert: <b>CaroSecure</b></text>

  <!-- Output / 4 Primal Cuts (Bottom) -->
  <rect x="35" y="315" width="690" height="50" rx="6" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="50" y="333" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#17344B">Ergebnis &amp; Teilstücke:</text>
  <text x="190" y="333" font-family="system-ui, sans-serif" font-size="10" fill="#37474F"><b>MFA %</b> (Gesamt-Muskelfleischanteil) · <b>Handelsklasse</b> (S, E, U, R, O, P)</text>
  <text x="50" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#455A64"><b>4 Hauptteilstücke:</b> Schinken (SCSI), Kotelett (KOKG), Lachs (LAKG), Teller/Schulter (TESI) &amp; Bauch (BAKG)</text>
</svg>
